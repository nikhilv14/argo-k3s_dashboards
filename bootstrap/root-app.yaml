# App-of-apps root Application.
# This is the ONLY manifest applied by hand (kubectl apply -f bootstrap/root-app.yaml).
# Everything else in the cluster is managed by ArgoCD through the `argocd/` path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nikhilv14/argo-k3s_dashboards.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # App-of-apps updating pre-existing Application objects fails with
      # "resourceVersion must be specified for an update" under client-side
      # apply; SSA handles the ownership handover correctly.
      - ServerSideApply=true
  # Child Applications' status subresource changes constantly (their own
  # sync/health); ignore it so root doesn't flap OutOfSync.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /status
        - /operation
