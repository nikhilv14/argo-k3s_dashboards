# App-of-apps root Application.
# This is the ONLY manifest applied by hand (kubectl apply -f bootstrap/root-app.yaml).
# Everything else in the cluster is managed by ArgoCD through the `argocd/` path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nikhilv14/argo-k3s_dashboards.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
