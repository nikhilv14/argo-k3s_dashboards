# Front door for hosts outside the cluster to push logs into Loki: the PVE
# promtail agents (see pve-hosts/) and the Home Assistant Alloy add-on.
# MetalLB gives it a stable LAN VIP (192.168.12.63) that survives any single
# node going down; the NodePort 30100 is kept so existing PVE configs keep
# working unchanged.
apiVersion: v1
kind: Service
metadata:
  name: loki-nodeport
  namespace: monitoring
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.12.63
  labels:
    app.kubernetes.io/name: loki
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  ports:
    - name: http-metrics
      port: 3100
      targetPort: http-metrics
      nodePort: 30100
