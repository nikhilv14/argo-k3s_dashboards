# bge-m3 embeddings on CPU (the spec puts embeddings on the Z690 host CPU, not on
# either GPU: 2.3 GB of weights would evict the P1000's family model).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-embed
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-embed
  template:
    metadata:
      labels:
        app: llm-embed
    spec:
      initContainers:
        - name: fetch-model
          image: busybox:1.36
          command:
            - sh
            - -c
            - wget -q -O /models/bge-m3-Q8_0.gguf https://huggingface.co/gpustack/bge-m3-GGUF/resolve/main/bge-m3-Q8_0.gguf
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: embed
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - --model
            - /models/bge-m3-Q8_0.gguf
            - --embeddings
            - --host
            - 0.0.0.0
            - --port
            - "8082"
            - -c
            - "8192"
            - --threads
            - "6"
            - --parallel
            - "2"
          ports:
            - containerPort: 8082
          volumeMounts:
            - name: models
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 3Gi
      volumes:
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-embed
  namespace: llm
spec:
  selector:
    app: llm-embed
  ports:
    - port: 8082
      targetPort: 8082
