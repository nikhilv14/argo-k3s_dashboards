# bge-m3 embeddings on the P1000 GPU (VM 114, 192.168.12.245:8090).
# Was a CPU pod on the k3s worker: 732 ms/request and 5-6 cores during a document
# ingest. On the P1000 it is 232 ms and leaves the worker's CPU alone. ComfyUI runs
# with --disable-smart-memory so the two share the 4 GB card without evicting each other.
apiVersion: v1
kind: Service
metadata:
  name: llm-embed
  namespace: llm
spec:
  ports:
    - name: http
      port: 8082
      targetPort: 8090
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: llm-embed-manual
  namespace: llm
  labels:
    kubernetes.io/service-name: llm-embed
    endpointslice.kubernetes.io/managed-by: user
addressType: IPv4
ports:
  - name: http
    port: 8090
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.12.245
    conditions:
      ready: true
