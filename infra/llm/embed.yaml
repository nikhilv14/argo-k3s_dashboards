# Embeddings, primary = P1000 GPU (VM 114, 192.168.12.245:8090, llama-embed-gpu.service)
#          fallback = this CPU pod, used only when the P1000 stops answering.
# The router proxies /v1/embeddings and does the failover, so Open WebUI has one URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-embed-cpu
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-embed-cpu
  template:
    metadata:
      labels:
        app: llm-embed-cpu
    spec:
      initContainers:
        - name: fetch-model
          image: busybox:1.36
          command:
            - sh
            - -c
            - wget -q -O /models/bge-m3-Q8_0.gguf https://huggingface.co/gpustack/bge-m3-GGUF/resolve/main/bge-m3-Q8_0.gguf
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: embed
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - --model
            - /models/bge-m3-Q8_0.gguf
            - --embeddings
            - --host
            - 0.0.0.0
            - --port
            - "8082"
            - -c
            - "8192"
            # only 4 threads: this box also runs the 27B, and the fallback should not
            # starve it the way the old 6-thread pod did
            - --threads
            - "4"
            - --parallel
            - "2"
          ports:
            - containerPort: 8082
          volumeMounts:
            - name: models
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 3Gi
      volumes:
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-embed-cpu
  namespace: llm
spec:
  selector:
    app: llm-embed-cpu
  ports:
    - port: 8082
      targetPort: 8082
