# LAN access. chat.home = the UI, llm.home = the OpenAI-compatible router (rules
# 1-5 apply), both on the existing ingress-nginx LB at 192.168.12.61 with the
# internal-ca issuer, same as grafana.home / immich.home.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: llm
  annotations:
    cert-manager.io/cluster-issuer: internal-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: chat.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
    - host: chat.daemonagent.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
  tls:
    - hosts:
        - chat.home
        - chat.daemonagent.net
      secretName: open-webui-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-router
  namespace: llm
  annotations:
    cert-manager.io/cluster-issuer: internal-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: llm.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-router
                port:
                  number: 8085
  tls:
    - hosts:
        - llm.home
      secretName: llm-router-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-embed
  namespace: llm
  annotations:
    cert-manager.io/cluster-issuer: internal-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: embed.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-router
                port:
                  number: 8085
  tls:
    - hosts:
        - embed.home
      secretName: llm-embed-tls
