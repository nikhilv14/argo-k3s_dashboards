# Single entry point for every local model. No master_key on purpose: this is a
# ClusterIP service that is never exposed outside the cluster, so there is no
# credential to keep in git. Add a SealedSecret master_key if it ever gets an
# ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          env:
            # This proxy is a ClusterIP that only fronts local llama-servers plus one
            # remote alias. Running without a master_key avoids keeping a credential in
            # git and avoids adding a database (this build needs one for key auth).
            # It is never exposed outside the cluster; add a sealed master_key +
            # database_url before any ingress.
            - name: LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY
              value: "true"
            - name: NOUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nous-api-key
                  key: NOUS_API_KEY
          volumeMounts:
            - name: cfg
              mountPath: /etc/litellm
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: cfg
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: llm
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
