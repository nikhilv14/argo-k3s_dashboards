apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
generatorOptions:
  disableNameSuffixHash: true
resources:
  - namespace.yaml
  - llama-endpoints.yaml
  - nous-sealed.yaml
  - litellm.yaml
  - router.yaml
  - embed.yaml
  - openwebui.yaml
configMapGenerator:
  - name: llm-router-code
    files:
      - main.py
