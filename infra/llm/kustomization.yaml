apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
resources:
  - namespace.yaml
  - llama-endpoints.yaml
  - nous-sealed.yaml
  - webui-sealed.yaml
  - litellm.yaml
  - router.yaml
  - embed.yaml
  - openwebui.yaml
  - ingress.yaml
configMapGenerator:
  - name: llm-router-code
    files:
      - main.py
  - name: litellm-config
    files:
      # key name matters: the container reads /etc/litellm/config.yaml
      - config.yaml=litellm-config.yaml
