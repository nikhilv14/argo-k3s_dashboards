# Family front-end. Talks to the router, not LiteLLM directly, so rules 1-5
# apply to everything entered through the UI. Data volume on truenas-iscsi
# (proven working after the initiator-group fix) rather than local-path.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data
  namespace: llm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_BASE_URL
              value: http://llm-router.llm.svc.cluster.local:8085/v1
            - name: OPENAI_API_KEY
              value: sk-router-unused
            # RAG embeddings: use the cluster's bge-m3 service instead of letting the UI
            # download and run its own sentence-transformers model on CPU.
            - name: RAG_EMBEDDING_ENGINE
              value: openai
            - name: RAG_OPENAI_API_BASE_URL
              value: http://llm-embed.llm.svc.cluster.local:8082/v1
            - name: RAG_OPENAI_API_KEY
              value: sk-local-unused
            - name: RAG_EMBEDDING_MODEL
              value: bge-m3
            # 0.13 stores config in webui.db and only seeds from env on first boot, so
            # env changes were ignored (web search never appeared in /api/config).
            # Env is authoritative here, matching the GitOps flow for the rest of the stack.
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: searxng
            - name: SEARXNG_QUERY_URL
              value: http://searxng.search.svc.cluster.local:8080/search?q=<query>
            - name: WEB_SEARCH_RESULT_COUNT
              value: "3"
            - name: WEB_SEARCH_CONCURRENT_REQUESTS
              value: "1"
            - name: WEBUI_URL
              value: https://chat.home
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: WEBUI_SECRET_KEY
              value: change-me-on-first-run
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: llm
spec:
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080
