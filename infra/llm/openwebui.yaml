# Family front-end. Talks to the router, not LiteLLM directly, so rules 1-5 apply to
# everything entered through the UI. Data volume on truenas-iscsi; the DB (workspace
# models, config rows) lives there, so losing the volume loses those settings.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data
  namespace: llm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
spec:
  replicas: 1
  # Single replica on a ReadWriteOnce PVC (truenas-iscsi): RollingUpdate tries to
  # start the new pod before the old one releases the volume, so the new pod hangs
  # forever on FailedAttachVolume ("Volume is already used by pod(s) ..."). Recreate
  # terminates the old pod first so the volume detaches and the new pod can attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          # Pinned, not :main. A floating tag plus a cached old digest let an image that did
          # not know the DB's alembic revision (9f6c2a8d1b43, added in v0.13.1) boot-loop on
          # "Can't locate revision identified by ...". Bump deliberately: v0.13.4.
          image: ghcr.io/open-webui/open-webui:v0.13.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_BASE_URL
              value: http://llm-router.llm.svc.cluster.local:8085/v1
            - name: OPENAI_API_KEY
              value: sk-router-unused
            - name: ENABLE_OLLAMA_API
              value: "false"
            # Fernet key: must be 32 url-safe base64 bytes. Sealed, not in git.
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: webui-secret
                  key: WEBUI_SECRET_KEY
            - name: WEBUI_URL
              value: https://chat.daemonagent.net
            # SSO: Open WebUI is a native OIDC client of Hydra (client 'openwebui').
            # Local login form stays on as break-glass until the round trip is
            # proven in a browser; then it gets disabled.
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OPENID_PROVIDER_URL
              value: https://hydra.daemonagent.net/.well-known/openid-configuration
            - name: OAUTH_CLIENT_ID
              value: openwebui
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: webui-secret
                  key: OAUTH_CLIENT_SECRET
            - name: OPENID_REDIRECT_URI
              value: https://chat.daemonagent.net/oauth/oidc/callback
            - name: OAUTH_SCOPES
              value: openid email profile
            - name: OAUTH_PROVIDER_NAME
              value: daemonagent SSO
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            # 0.13 stores config in webui.db and only seeds from env on first boot.
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            # Housekeeping calls (chat titles, tags, web-search query generation) fall
            # back to the first connection model when TASK_MODEL is empty - which meant a
            # 27B forward pass over 8 cores per message even on a cloud chat. Send them
            # to the cloud model instead so cloud traffic stays entirely off-box.
            - name: TASK_MODEL
              value: cloud
            # Default to the Workspace wrapper for the cloud model, not the raw
            # connection model: only Workspace rows can carry toolIds, so this
            # is what makes the central RAG corpus tool available in new chats.
            - name: DEFAULT_MODELS
              value: cloud-nous
            # Web search was embedding every fetched page into a per-user vector
            # collection (web-search-<user>-...), which pinned the bge-m3 CPU server at
            # ~5.7 cores for minutes after each search. Bypass it: inject the text
            # straight into the prompt instead of vectorising it.
            - name: BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL
              value: "true"
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: searxng
            - name: SEARXNG_QUERY_URL
              value: http://searxng.search.svc.cluster.local:8080/search?q=<query>
            - name: WEB_SEARCH_RESULT_COUNT
              value: "3"
            - name: WEB_SEARCH_CONCURRENT_REQUESTS
              value: "1"
            # RAG embeddings from the cluster bge-m3 service.
            - name: RAG_EMBEDDING_ENGINE
              value: openai
            - name: RAG_OPENAI_API_BASE_URL
              value: http://rag-hub.llm.svc.cluster.local:8765/v1
            - name: RAG_OPENAI_API_KEY
              value: sk-local-unused
            - name: RAG_EMBEDDING_MODEL
              value: bge-m3
            - name: RAG_EMBEDDING_BATCH_SIZE
              value: "32"
            - name: RAG_EMBEDDING_CONCURRENT_REQUESTS
              value: "4"
            - name: ENABLE_RAG_HYBRID_SEARCH
              value: "true"
            - name: RAG_RERANKING_ENGINE
              value: external
            - name: RAG_EXTERNAL_RERANKER_URL
              value: http://rag-hub.llm.svc.cluster.local:8765/v1/rerank
            - name: RAG_EXTERNAL_RERANKER_API_KEY
              value: sk-local-unused
            - name: RAG_EXTERNAL_RERANKER_TIMEOUT
              value: "30"
            - name: RAG_RERANKING_MODEL
              value: bge-reranker-v2-m3
            # Image generation removed with the ComfyUI purge; legacy tool
            # call formatting is kept for the remaining tools.
            - name: DEFAULT_MODEL_PARAMS
              value: '{"function_calling": "legacy"}'
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: llm
spec:
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080
