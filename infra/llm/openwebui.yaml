# Family front-end. Talks to the router, not LiteLLM directly, so rules 1-5 apply to
# everything entered through the UI. Data volume on truenas-iscsi; the DB (workspace
# models, config rows) lives there, so losing the volume loses those settings.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data
  namespace: llm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_BASE_URL
              value: http://llm-router.llm.svc.cluster.local:8085/v1
            - name: OPENAI_API_KEY
              value: sk-router-unused
            - name: ENABLE_OLLAMA_API
              value: "false"
            # Fernet key: must be 32 url-safe base64 bytes. Sealed, not in git.
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: webui-secret
                  key: WEBUI_SECRET_KEY
            - name: WEBUI_URL
              value: https://chat.daemonagent.net
            # SSO: Open WebUI is a native OIDC client of Hydra (client 'openwebui').
            # Local login form stays on as break-glass until the round trip is
            # proven in a browser; then it gets disabled.
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OPENID_PROVIDER_URL
              value: https://hydra.daemonagent.net/.well-known/openid-configuration
            - name: OAUTH_CLIENT_ID
              value: openwebui
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: webui-secret
                  key: OAUTH_CLIENT_SECRET
            - name: OPENID_REDIRECT_URI
              value: https://chat.daemonagent.net/oauth2/callback
            - name: OAUTH_SCOPES
              value: openid email profile
            - name: OAUTH_PROVIDER_NAME
              value: daemonagent SSO
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"
            # 0.13 stores config in webui.db and only seeds from env on first boot.
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            # Housekeeping calls (chat titles, tags, web-search query generation) fall
            # back to the first connection model when TASK_MODEL is empty - which meant a
            # 27B forward pass over 8 cores per message even on a cloud chat. Send them
            # to the cloud model instead so cloud traffic stays entirely off-box.
            - name: TASK_MODEL
              value: cloud
            # Web search was embedding every fetched page into a per-user vector
            # collection (web-search-<user>-...), which pinned the bge-m3 CPU server at
            # ~5.7 cores for minutes after each search. Bypass it: inject the text
            # straight into the prompt instead of vectorising it.
            - name: BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL
              value: "true"
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: searxng
            - name: SEARXNG_QUERY_URL
              value: http://searxng.search.svc.cluster.local:8080/search?q=<query>
            - name: WEB_SEARCH_RESULT_COUNT
              value: "3"
            - name: WEB_SEARCH_CONCURRENT_REQUESTS
              value: "1"
            # RAG embeddings from the cluster bge-m3 service.
            - name: RAG_EMBEDDING_ENGINE
              value: openai
            - name: RAG_OPENAI_API_BASE_URL
              value: http://llm-router.llm.svc.cluster.local:8085/v1
            - name: RAG_OPENAI_API_KEY
              value: sk-local-unused
            - name: RAG_EMBEDDING_MODEL
              value: bge-m3
            # Images render on the P1000 (VM 114) via ComfyUI; the 5060 Ti stays on the LLM.
            - name: ENABLE_IMAGE_GENERATION
              value: "true"
            - name: IMAGE_GENERATION_ENGINE
              value: comfyui
            - name: COMFYUI_BASE_URL
              value: http://192.168.12.245:8188
            - name: IMAGE_GENERATION_MODEL
              value: v1-5-pruned-emaonly-fp16.safetensors
            - name: IMAGE_SIZE
              value: 512x512
            - name: COMFYUI_WORKFLOW
              value: |
                {"1": {"class_type": "CheckpointLoaderSimple", "inputs": {"ckpt_name": "v1-5-pruned-emaonly-fp16.safetensors"}}, "2": {"class_type": "CLIPTextEncode", "inputs": {"text": "", "clip": ["1", 1]}}, "3": {"class_type": "CLIPTextEncode", "inputs": {"text": "blurry, low quality", "clip": ["1", 1]}}, "4": {"class_type": "EmptyLatentImage", "inputs": {"width": 512, "height": 512, "batch_size": 1}}, "5": {"class_type": "KSampler", "inputs": {"seed": 0, "steps": 20, "cfg": 7.0, "sampler_name": "euler", "scheduler": "normal", "denoise": 1.0, "model": ["1", 0], "positive": ["2", 0], "negative": ["3", 0], "latent_image": ["4", 0]}}, "6": {"class_type": "VAEDecode", "inputs": {"samples": ["5", 0], "vae": ["1", 2]}}, "7": {"class_type": "SaveImage", "inputs": {"filename_prefix": "webui", "images": ["6", 0]}}}
            - name: COMFYUI_WORKFLOW_NODES
              value: |
                [{"type": "prompt", "node_ids": ["2"], "key": "text"}, {"type": "negative_prompt", "node_ids": ["3"], "key": "text"}, {"type": "width", "node_ids": ["4"], "key": "width"}, {"type": "height", "node_ids": ["4"], "key": "height"}, {"type": "steps", "node_ids": ["5"], "key": "steps"}, {"type": "seed", "node_ids": ["5"], "key": "seed"}]
            # Chat-triggered image generation requires legacy tool handling.
            - name: DEFAULT_MODEL_PARAMS
              value: '{"function_calling": "legacy"}'
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: llm
spec:
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080
