apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter-201
  namespace: monitoring
  labels:
    pve.node: pve
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
      pve.node: pve
  endpoints:
    - port: metrics
      interval: 60s
      # pve-exporter takes the PVE node from the target query parameter
      path: /pve?target=192.168.12.201&cluster=1&node=1
---
