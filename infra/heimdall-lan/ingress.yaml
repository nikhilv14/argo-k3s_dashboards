apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heimdall-lan
  namespace: admin-dash
  annotations:
    cert-manager.io/cluster-issuer: internal-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: dash.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heimdall-lan
                port:
                  number: 80
  tls:
    - hosts:
        - dash.home
      secretName: heimdall-lan-tls
