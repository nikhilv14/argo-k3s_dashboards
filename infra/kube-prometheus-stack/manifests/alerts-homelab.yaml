# Cluster + PVE alert rules. Prometheus picks these up cluster-wide
# (ruleSelectorNilUsesHelmValues: false in kube-prometheus-stack values).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
  labels:
    scope: homelab
spec:
  groups:
    # ---------- k3s cluster ----------
    - name: homelab.nodes
      rules:
        - alert: K3sNodeDown
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "k3s node {{ $labels.node }} not Ready"
            description: "Node {{ $labels.node }} has not been Ready for 5 minutes."
        - alert: NodeFilesystemAlmostFull
          expr: |
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*|/boot.*"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*|/boot.*"} < 0.10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} >90% full"
        - alert: NodeHighMemoryPressure
          expr: |
            (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} memory >90% used"
    - name: homelab.storage
      rules:
        - alert: LonghornVolumeDegraded
          # longhorn_volume_robustness is a gauge per Longhorn 1.10 docs:
          # 0=unknown, 1=healthy, 2=degraded, 3=faulted.
          expr: longhorn_volume_robustness == 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} degraded"
        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness == 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} FAULTED"
        - alert: PVCAlmostFull
          expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.9
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} >90% full"
    - name: homelab.workloads
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarting frequently"
        - alert: CertificateExpiringSoon
          expr: |
            certmanager_certificate_expiry_timestamp_seconds - time() < 14 * 86400
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.certificate_name }} expires within 14 days"
    - name: homelab.observability
      rules:
        # ---------- monitoring stack self-monitoring ----------
        - alert: PrometheusDown
          expr: up{job="kube-prometheus-stack-prometheus"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus target {{ $labels.job }} down"
        - alert: AlertmanagerDown
          expr: up{job="kube-prometheus-stack-alertmanager"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Alertmanager target {{ $labels.job }} down"
        - alert: GrafanaDown
          expr: up{job="kube-prometheus-stack-grafana"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Grafana target {{ $labels.job }} down"
        - alert: LokiDown
          expr: up{job=~".*loki.*"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Loki target {{ $labels.job }} down"
        - alert: PromtailDown
          expr: up{job=~".*promtail.*"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Promtail target {{ $labels.job }} down"
            description: "Log shipping from {{ $labels.instance }} may be stalled."
        - alert: PVEExporterDown
          expr: up{job=~"pve-exporter-(201|220|130)"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PVE exporter target {{ $labels.job }} down"
            description: "Prometheus cannot scrape {{ $labels.job }} for 10 minutes; PVE metrics stale."
        - alert: PVENodeDown
          # max by (id): all three pve-exporters (201/220/130) scrape the whole
          # cluster, so the raw series exists once per exporter and every event
          # used to fire 3 identical alerts / 3 emails.
          expr: max by (id) (pve_up{id=~"node/.*"}) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Proxmox node {{ $labels.id }} is down"
        - alert: PVENodeUptimeReset
          # Informational: real node loss is covered by PVENodeDown / K3sNodeDown.
          # severity=info is routed to the "null" receiver, so planned reboots stay
          # visible in the Alertmanager UI without paging. for: 5m (not 0m) — the
          # <300s condition only holds for ~5 minutes, so a longer `for` would
          # suppress the alert entirely.
          expr: max by (id) (pve_uptime_seconds{id=~"node/.*"}) < 300
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "Proxmox node {{ $labels.id }} rebooted"
        - alert: PVEGuestDown
          # Ignore list: lxc/100 and lxc/106 are intentionally decommissioned
          # (kept stopped on purpose); lxc/104 is still monitored.
          expr: max by (id) (pve_up{id=~"qemu/.*|lxc/.*",id!~"lxc/(100|106)"}) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Proxmox guest {{ $labels.id }} is down"
            description: "VM/LXC {{ $labels.id }} reports down for 10 minutes."
        - alert: PVEStorageAlmostFull
          expr: |
            pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes{id=~"storage/.*"} > 0.90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PVE storage {{ $labels.id }} >90% full"
        - alert: PVENodeMemoryHigh
          # 0.95, not 0.90: all three PVE nodes sit structurally high (31 GiB hosts
          # with 16+14 GiB guests), so 90% paged permanently. 95% is the level
          # where the hypervisor actually starts hurting.
          expr: |
            max by (id) (pve_memory_usage_bytes{id=~"node/.*"} / pve_memory_size_bytes{id=~"node/.*"}) > 0.95
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox node {{ $labels.id }} memory >95% used"
            description: "{{ $labels.id }} has been above 95% memory for 15 minutes; guests are at risk of host OOM."
        - alert: PVENotBackedUpGuests
          # Change-based, not standing: with `> 0` this fired forever on the 11
          # permanently-uncovered guests and mailed every 12h. Now it only fires
          # while the uncovered count is higher than it was 6h ago, i.e. when a
          # guest loses backup coverage. The absolute number stays on the Homelab
          # dashboard and in the Alertmanager UI.
          expr: max(pve_not_backed_up_total) > max(pve_not_backed_up_total offset 6h)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Proxmox guest backup coverage regressed ({{ $value }} uncovered)"
            description: "pve_not_backed_up_total rose within the last 6h: a guest is no longer matched by any vzdump schedule."
        - alert: LogIngestStalled
          expr: sum(increase(loki_distributor_lines_received_total[15m])) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Loki has received no log lines for 15 minutes"
    # ---------- network / blackbox ----------
    - name: homelab.network
      rules:
        - alert: ProbeTargetDown
          # probe_success==0 means the probe ran and the target failed;
          # probe_success absent means we are not scraping (BlindMonitor below).
          expr: probe_success == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} probe failing for {{ $labels.instance }}"
            description: "blackbox probe {{ $labels.job }} to {{ $labels.instance }} has failed for 5 minutes."
        - alert: ProbeHighLatency
          expr: probe_duration_seconds > 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} slow: {{ $value }}s to {{ $labels.instance }}"
        - alert: ProbeSSLCertExpiringSoon
          expr: probe_ssl_earliest_cert_expiry_seconds - time() < 21 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TLS cert for {{ $labels.instance }} expires in <21 days"
    # ---------- certificates ----------
    - name: homelab.certificates
      rules:
        - alert: CertExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 30 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in <30 days"
            description: "cert-manager reports {{ $value | humanizeDuration }} to expiry; renewal has not happened yet."
        - alert: CertNotReady
          expr: certmanager_certificate_ready_condition{condition="True"} == 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready"
            description: "Issuance/renewal has been failing for 30 minutes."
    # ---------- proxmox backups ----------
    - name: homelab.pve-backup
      rules:
        - alert: PVEBackupJobFailed
          # require last_run > 0 so a job that has never run (e.g. monthly)
          # does not page before its first execution
          expr: |
            pve_backup_job_last_status == 0
              and on(id) pve_backup_job_enabled == 1
              and on(id) pve_backup_job_last_run_timestamp_seconds > 0
              and on(id) pve_backup_job_missed_run == 0
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: "PVE backup job {{ $labels.id }} ({{ $labels.schedule }}) had failures"
            description: "At least one vzdump task in the last slot ended in an error status."
        - alert: PVEBackupJobRunErrors
          # the job-level task (id='') reports aggregate "job errors", which is
          # invisible per guest and in pve_not_backed_up_*
          expr: pve_backup_jobrun_status == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "PVE vzdump job on {{ $labels.node }} finished with 'job errors'"
    # ---------- router (OpenWrt, scraped directly) ----------
    - name: homelab.router
      rules:
        - alert: OpenWrtDown
          expr: up{job="openwrt"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OpenWrt router metrics endpoint unreachable"
            description: "Prometheus cannot scrape 192.168.12.1:9100 (prometheus-node-exporter-lua). Router down, or the exporter/firewall changed."
        - alert: OpenWrtConntrackHigh
          expr: node_nf_conntrack_entries{job="openwrt"} / node_nf_conntrack_entries_limit{job="openwrt"} > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Router conntrack table >80% full"
            description: "Near exhaustion, new connections will be dropped. Check for a NAT/Port-forward storm or a client opening many flows."
        - alert: OpenWrtHighMemory
          expr: (1 - node_memory_MemAvailable_bytes{job="openwrt"} / node_memory_MemTotal_bytes{job="openwrt"}) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Router memory >90% used"
        - alert: OpenWrtHighLoad
          expr: node_load1{job="openwrt"} / count(node_cpu_seconds_total{job="openwrt",mode="idle"}) > 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Router load {{ $value }} per CPU over 15m"
