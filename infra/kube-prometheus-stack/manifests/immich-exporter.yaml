# immich-exporter (github.com/moond4rk/immich-exporter) - reports what the Immich
# library holds: assets, cameras, people, places, storage, jobs, backups.
# Immich's built-in telemetry covers server performance; this covers the library.
#
# The API key must be an Immich *admin* key: Immich API keys inherit the creating
# user's permissions, and a non-admin key leaves the library panels empty.
# Created out of band, never committed:
#   kubectl -n monitoring create secret generic immich-exporter --from-literal=token=<key>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-exporter
  namespace: monitoring
  labels: {app: immich-exporter}
spec:
  replicas: 1
  selector:
    matchLabels: {app: immich-exporter}
  template:
    metadata:
      labels: {app: immich-exporter}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: immich-exporter
          image: ghcr.io/moond4rk/immich-exporter:v1.5.0
          imagePullPolicy: IfNotPresent
          env:
            - name: IMMICH_BASE_URL
              value: "http://immich-server.immich.svc.cluster.local:2283/api"
            - name: IMMICH_API_TOKEN
              valueFrom:
                secretKeyRef: {name: immich-exporter, key: token}
            - name: SCRAPE_INTERVAL
              value: 2m
            - name: BREAKDOWN_INTERVAL
              value: 15m
          ports:
            - {name: metrics, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-exporter
  namespace: monitoring
  labels: {app: immich-exporter}
spec:
  selector: {app: immich-exporter}
  ports:
    - {name: metrics, port: 8000, targetPort: metrics}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-exporter
  namespace: monitoring
  labels: {app.kubernetes.io/name: immich-exporter, app.kubernetes.io/part-of: kube-prometheus-stack}
spec:
  selector:
    matchLabels: {app: immich-exporter}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 120s
      scrapeTimeout: 30s
---
# Community alert rules (moond4rk/immich-exporter deploy/alerts.yml), carried verbatim into
# a PrometheusRule: exporter health, failing/stalled job queues, library volume, offline
# assets, integrity findings, database backups, user quota, update available.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: immich-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: immich-exporter
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  groups:
    - name: immich-exporter
      rules:
        - alert: ImmichExporterMissing
          expr: absent(immich_exporter_build_info)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: No immich-exporter is being scraped
            description: Prometheus has no immich_exporter_build_info series, so the exporter is down or nothing scrapes it.

        - alert: ImmichExporterPollFailing
          expr: immich_exporter_up == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: immich-exporter cannot poll Immich
            description: >-
              Polls of the Immich API on {{ $labels.instance }} have failed for 15 minutes.
              immich_exporter_collector_success and the exporter log name the failing collector.

        - alert: ImmichExporterStale
          expr: time() - immich_exporter_last_success_timestamp_seconds > 1800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: immich-exporter's data is over 30 minutes old
            description: >-
              The last successful poll on {{ $labels.instance }} was {{ $value | humanizeDuration }} ago.
              Raise the threshold if you poll less often than every few minutes.

        - alert: ImmichExporterCollectorFailing
          # Only a collector that worked within the past week: one the API key may not use reports 0 from the start.
          expr: >-
            max by (collector) (immich_exporter_collector_success) == 0
            and max by (collector) (max_over_time(immich_exporter_collector_success[7d])) == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: The {{ $labels.collector }} collector of immich-exporter stopped working
            description: >-
              It got its data within the past week and has failed for an hour, so its metrics are missing while
              immich_exporter_up stays 1. The exporter log names the error; an Immich upgrade may have changed the endpoint.
              The alert ends by itself after a week without a success.

        - alert: ImmichDown
          expr: immich_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Immich does not answer
            description: Immich has not answered /server/ping from {{ $labels.instance }} for 5 minutes.

    - name: immich
      rules:
        - alert: ImmichMaintenanceMode
          expr: immich_server_maintenance_mode == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Immich has been in maintenance mode for 30 minutes
            description: A database restore or other maintenance task may be stuck; the exporter collects nothing else meanwhile.

        - alert: ImmichJobsFailing
          # Aggregate before comparing: delta() per series reads a restarted exporter's new series as growth from
          # zero on VictoriaMetrics, so every restart while a job sits failed would fire this for an hour.
          expr: max by (queue) (immich_job_queue{state="failed"}) > max by (queue) (immich_job_queue{state="failed"} offset 1h)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Immich jobs are failing in the {{ $labels.queue }} queue
            description: More {{ $labels.queue }} jobs failed in the last hour; the Immich server log shows why.

        - alert: ImmichQueueStalled
          expr: >-
            max by (queue) (immich_job_queue{state="waiting"}) > 0
            and max by (queue) (immich_job_queue{state="active"}) == 0
            unless max by (queue) (immich_job_queue_paused) == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Immich's {{ $labels.queue }} queue is not making progress
            description: Jobs have waited in the {{ $labels.queue }} queue for an hour with none running, and the queue is not paused.

        - alert: ImmichQueuePaused
          expr: max by (queue) (immich_job_queue_paused) == 1
          for: 1d
          labels:
            severity: info
          annotations:
            summary: Immich's {{ $labels.queue }} queue has been paused for a day
            description: Its jobs wait until an admin resumes the queue in Immich's job settings.

        - alert: ImmichStorageLow
          expr: immich_storage_available_bytes / immich_storage_size_bytes < 0.05
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Immich's library volume is over 95% full
            description: Only {{ $value | humanizePercentage }} of the volume holding the library is free on {{ $labels.instance }}.

        - alert: ImmichStorageFillingUp
          # Aggregate before forecasting: a restarted exporter's new series would read its first minutes as the week.
          expr: >-
            predict_linear(max(immich_storage_available_bytes)[7d:1h], 30 * 24 * 3600) < 0
            and max(immich_storage_available_bytes) / max(immich_storage_size_bytes) < 0.25
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: Immich's library volume fills up within 30 days at the past week's rate
            description: The volume holding the library is under 25% free and shrinking.

        - alert: ImmichAssetsOffline
          expr: immich_assets_offline > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Immich has {{ $value }} offline assets
            description: Files of an external library are missing on disk; check its mount, then rescan the library.

        - alert: ImmichIntegrityIssues
          expr: immich_integrity_issues{type=~"missing_file|checksum_mismatch"} > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Immich's integrity checks flagged {{ $value }} files ({{ $labels.type }})
            description: Originals are missing on disk or no longer match their checksum; Immich lists them under Administration > Maintenance.

        - alert: ImmichDatabaseBackupStale
          expr: time() - immich_database_backup_last_timestamp_seconds > 26 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Immich's newest database backup is over a day old
            description: >-
              Immich writes a database backup every night by default, and the newest is {{ $value | humanizeDuration }} old.
              Ignore this if you turned Immich's database backups off on purpose.

        - alert: ImmichDatabaseBackupShrank
          expr: immich_database_backup_last_size_bytes < 0.5 * immich_database_backups_size_bytes / immich_database_backups
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Immich's newest database backup is under half the average size
            description: A much smaller dump than usual can mean the backup was cut short; check that it restores.

        - alert: ImmichUserQuotaNearlyFull
          expr: immich_user_usage_bytes / immich_user_quota_bytes > 0.9
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.user }} has used over 90% of their storage quota"
            description: Uploads fail once the quota is full; raise it under Administration > Users.

        - alert: ImmichUpdateAvailable
          expr: immich_server_update_available == 1
          for: 1d
          labels:
            severity: info
          annotations:
            summary: A newer Immich release is available
            description: immich_server_latest_version_info names it; read its release notes before upgrading.
