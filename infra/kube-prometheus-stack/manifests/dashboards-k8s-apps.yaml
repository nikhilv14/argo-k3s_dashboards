# Cluster-wide app inventory: ArgoCD sync/health (argocd_app_info via
# infra/argocd-metrics), workload readiness/restarts/resources from
# kube-state-metrics + cAdvisor, and GitOps drift (workloads with no ArgoCD
# tracking-id annotation). Complements the per-app dashboards and ArgoCD UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-apps
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  k8s-apps.json: |
    {
      "title": "Kubernetes \u2014 All Apps",
      "uid": "k8s-apps",
      "tags": [
        "homelab",
        "kubernetes",
        "argocd"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "ArgoCD apps",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(argocd_app_info)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Not Synced",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(argocd_app_info{sync_status!=\"Synced\"}) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Unhealthy",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(argocd_app_info{health_status!~\"Healthy|Progressing\"}) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Unmanaged deployments",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(kube_deployment_spec_replicas{namespace!~\"kube-system|argocd|kube-public|kube-node-lease|local-path-storage|default\"} unless on (namespace,deployment) kube_deployment_annotations{annotation_argocd_argoproj_io_tracking_id!=\"\"}) or vector(0)",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "ArgoCD applications",
          "type": "table",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "argocd_app_info",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "pod": true,
                  "service": true,
                  "namespace": true,
                  "dest_server": true,
                  "operation": true,
                  "autosync_enabled": true
                },
                "renameByName": {
                  "name": "App",
                  "project": "Project",
                  "sync_status": "Sync",
                  "health_status": "Health",
                  "dest_namespace": "Namespace",
                  "repo": "Repo"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "Deployments with unavailable replicas",
          "type": "table",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kube_deployment_spec_replicas - kube_deployment_status_replicas_available > 0",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "pod": true,
                  "service": true
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "deployment": "Deployment",
                  "Value": "Missing replicas"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 7,
          "title": "Pod restarts (1h)",
          "type": "table",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(15, sum by (namespace,pod) (increase(kube_pod_container_status_restarts_total[1h])))",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "pod": "Pod",
                  "Value": "Restarts"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 8,
          "title": "Top CPU (cores)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(10, sum by (namespace,pod) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\"}[5m])))",
              "instant": false,
              "range": true,
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "id": 9,
          "title": "Top memory",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(10, sum by (namespace,pod) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\"}))",
              "instant": false,
              "range": true,
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "id": 10,
          "title": "Unmanaged workloads (not via ArgoCD)",
          "type": "table",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 29
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "label_replace(kube_deployment_spec_replicas{namespace!~\"kube-system|argocd|kube-public|kube-node-lease|local-path-storage|default\"} unless on (namespace,deployment) kube_deployment_annotations{annotation_argocd_argoproj_io_tracking_id!=\"\"},\"workload\",\"$1\",\"deployment\",\"(.*)\") or label_replace(kube_statefulset_spec_replicas{namespace!~\"kube-system|argocd|kube-public|kube-node-lease|local-path-storage|default\"} unless on (namespace,statefulset) kube_statefulset_annotations{annotation_argocd_argoproj_io_tracking_id!=\"\"},\"workload\",\"$1\",\"statefulset\",\"(.*)\") or label_replace(kube_daemonset_status_desired_number_scheduled{namespace!~\"kube-system|argocd|kube-public|kube-node-lease|local-path-storage|default\"} unless on (namespace,daemonset) kube_daemonset_annotations{annotation_argocd_argoproj_io_tracking_id!=\"\"},\"workload\",\"$1\",\"daemonset\",\"(.*)\")",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "pod": true,
                  "service": true,
                  "deployment": true,
                  "statefulset": true,
                  "daemonset": true
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "workload": "Workload"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        }
      ]
    }
