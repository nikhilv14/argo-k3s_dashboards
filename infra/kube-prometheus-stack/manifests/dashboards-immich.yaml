# "Immich — System" dashboard. Data source: Immich's own Prometheus telemetry
# (IMMICH_TELEMETRY_INCLUDE=all -> /metrics on the immich-server Service, port 8081)
# plus the namespace log stream. Library/user-action panels live in the
# "Immich — Library & Users" dashboard (needs immich-exporter + an API key).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-immich
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  immich-system.json: |
    {
      "title": "Immich \u2014 System",
      "uid": "immich-system",
      "tags": [
        "homelab",
        "immich",
        "apps",
        "critical"
      ],
      "description": "Immich server internals from its own telemetry (IMMICH_TELEMETRY_INCLUDE=all, /metrics :8081): host resources, every repository/DB call duration, users, and the error log stream.",
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Host / system",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "title": "CPU utilization",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "system_cpu_utilization",
              "legendFormat": "{{otel_scope_name}} {{process_cpu_state}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          }
        },
        {
          "id": 3,
          "title": "Memory",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "system_memory_utilization",
              "legendFormat": "system used %"
            },
            {
              "refId": "B",
              "expr": "process_memory_usage",
              "legendFormat": "process RSS"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          },
          "overrides": [
            {
              "matcher": {
                "id": "byFrameRefID",
                "options": "B"
              },
              "properties": [
                {
                  "id": "unit",
                  "value": "bytes"
                },
                {
                  "id": "custom.axisPlacement",
                  "value": "right"
                }
              ]
            }
          ]
        },
        {
          "id": 4,
          "title": "Network I/O",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(system_network_io_total[15m])",
              "legendFormat": "{{direction}} {{interface}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          }
        },
        {
          "id": 5,
          "title": "Network errors / drops",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(system_network_errors_total[15m])",
              "legendFormat": "errors {{interface}}"
            },
            {
              "refId": "B",
              "expr": "rate(system_network_dropped_total[15m])",
              "legendFormat": "dropped {{interface}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "row",
          "title": "Database / IO \u2014 repository call durations",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "panels": []
        },
        {
          "id": 7,
          "title": "Key operations \u2014 p95 latency (ms)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(immich_asset_repository_get_time_bucket_duration_bucket[15m])))",
              "legendFormat": "asset get_time"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(immich_asset_repository_get_for_thumbnail_duration_bucket[15m])))",
              "legendFormat": "asset thumbnail"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(immich_album_repository_get_by_id_duration_bucket[15m])))",
              "legendFormat": "album get_by_id"
            },
            {
              "refId": "D",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(immich_person_repository_get_all_for_user_duration_bucket[15m])))",
              "legendFormat": "person get_all_for_user"
            },
            {
              "refId": "E",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(immich_job_repository_get_queue_duration_bucket[15m])))",
              "legendFormat": "job get_queue"
            },
            {
              "refId": "F",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(immich_search_repository_search_metadata_duration_bucket[15m])))",
              "legendFormat": "search metadata"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            }
          }
        },
        {
          "id": 8,
          "title": "Repository call rate \u2014 key operations",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(immich_asset_repository_get_time_duration_count[15m])) + sum(rate(immich_asset_repository_get_for_thumbnail_duration_count[15m])) + sum(rate(immich_album_repository_get_by_id_duration_count[15m])) + sum(rate(immich_person_repository_get_all_for_user_duration_count[15m])) + sum(rate(immich_job_repository_get_queue_duration_count[15m])) + sum(rate(immich_search_repository_search_metadata_duration_count[15m]))",
              "legendFormat": "ops/sec"
            }
          ]
        },
        {
          "id": 9,
          "title": "Key operations \u2014 calls/sec",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 26
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(immich_asset_repository_get_time_duration_count[15m]))",
              "legendFormat": "asset get_time"
            },
            {
              "refId": "B",
              "expr": "sum(rate(immich_asset_repository_get_for_thumbnail_duration_count[15m]))",
              "legendFormat": "asset thumbnail"
            },
            {
              "refId": "C",
              "expr": "sum(rate(immich_album_repository_get_by_id_duration_count[15m]))",
              "legendFormat": "album get_by_id"
            },
            {
              "refId": "D",
              "expr": "sum(rate(immich_person_repository_get_all_for_user_duration_count[15m]))",
              "legendFormat": "person get_all_for_user"
            },
            {
              "refId": "E",
              "expr": "sum(rate(immich_job_repository_get_queue_duration_count[15m]))",
              "legendFormat": "job get_queue"
            },
            {
              "refId": "F",
              "expr": "sum(rate(immich_search_repository_search_metadata_duration_count[15m]))",
              "legendFormat": "search metadata"
            }
          ]
        },
        {
          "id": 10,
          "title": "Users",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 26
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "immich_users_total"
            }
          ]
        },
        {
          "id": 11,
          "type": "row",
          "title": "Logs",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "panels": []
        },
        {
          "id": 12,
          "title": "Immich server log",
          "type": "logs",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 31
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"immich\"}",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true,
            "dedupStrategy": "none"
          }
        },
        {
          "id": 13,
          "title": "Immich errors",
          "type": "logs",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 31
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"immich\"} |~ \"(?i)error|fatal|exception|fail\"",
              "queryType": "range"
            }
          ],
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true,
            "dedupStrategy": "none"
          }
        }
      ]
    }
