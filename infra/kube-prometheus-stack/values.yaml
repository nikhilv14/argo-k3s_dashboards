# kube-prometheus-stack values (chart pinned in argocd/apps-infra.yaml).
# Targets the whole cluster (k3s): kubelet/cadvisor, node-exporter,
# kube-state-metrics, control-plane components.

# Select ALL ServiceMonitors / PodMonitors / PrometheusRules in the cluster
# instead of only ones labeled for this release, so workload repos
# (argo-immich-tieredstorage/monitoring, etc.) don't need stack-specific labels.
prometheus:
  prometheusSpec:
    retention: 30d
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        # Was 1Gi: caused a chronic OOM death spiral (84 restarts). Each
        # restart replays the WAL and compacts 2h TSDB blocks at 3+ cores,
        # spiking RSS past the limit before queries can even be served.
        # k3s cluster with cAdvisor + kube-state-metrics + PVE exporters
        # needs ~1.5Gi head; 2Gi leaves compaction headroom.
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-iscsi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-iscsi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    # Full alertmanager config (email routing to nikhil14aug@gmail.com via
    # Gmail SMTP, same credentials as ArgoCD notifications) lives in the
    # SealedSecret alertmanager-homelab-config
    # (infra/kube-prometheus-stack/manifests/alertmanager-config-sealed.yaml).
    # The chart's default `alertmanager.config`/`templateFiles` are ignored
    # when useExistingSecret is true.
    useExistingSecret: true
    configSecret: alertmanager-homelab-config

grafana:
  # Admin credentials live in the SealedSecret grafana-admin
  # (infra/kube-prometheus-stack/manifests/admin-secret.yaml, ArgoCD-managed).
  # Rotate by re-sealing that secret; do NOT put the password here in plain
  # text (a plaintext value also breaks the dashboard sidecar when it drifts
  # from the live UI password).
  admin:
    existingSecret: grafana-admin
  # The 5Gi PVC is truenas-iscsi (ReadWriteOnce). A RollingUpdate starts the new
  # pod on another node before the old one releases the volume, so the rollout
  # hangs on Multi-Attach until the old pod is force-deleted. Recreate drains
  # the old pod first. Seen on the 2026-11-09 password rotation.
  deploymentStrategy:
    type: Recreate
    # Must be nulled explicitly: the live Deployment still carries the
    # rollingUpdate block from the previous strategy and SSA would otherwise
    # keep it, and the API rejects rollingUpdate alongside type: Recreate.
    rollingUpdate: null
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      # Pod total was 602Mi against a 512Mi limit (3 restarts); the two
      # dashboard/datasource sidecars share the pod budget.
      memory: 768Mi
  # Google sign-in via the homelab SSO: Grafana is an OIDC client of Hydra
  # (client "grafana", created 2026-11-09, redirect /login/generic_oauth).
  # Hydra federates the Google identity through auth.daemonagent.net, so the
  # same Google account that opens dash/recipes opens Grafana - no second
  # password and no extra Google OAuth client to manage.
  # Local admin login stays enabled as break-glass (do NOT set auto_login).
  grafana.ini:
    server:
      # Without an explicit root_url Grafana builds the OAuth redirect_uri from
      # http://localhost:3000 (its default domain), which Hydra rejects. Pinning
      # the public host makes /login/generic_oauth -> https://<public>/login/... .
      # grafana.home still serves the UI; only absolute links point public.
      root_url: https://grafana.daemonagent.net/
    auth.generic_oauth:
      enabled: true
      name: Google
      allow_sign_up: true
      client_id: grafana
      # real value comes from the SealedSecret grafana-oauth via envValueFrom
      scopes: openid email profile
      auth_url: https://auth.daemonagent.net/oauth2/auth
      token_url: https://auth.daemonagent.net/oauth2/token
      api_url: https://auth.daemonagent.net/userinfo
      use_pkce: false
      allow_assign_grafana_admin: true
      # only the owner gets GrafanaAdmin; everyone else lands as Viewer
      role_attribute_path: "email == 'nikhil14aug@gmail.com' && 'GrafanaAdmin' || 'Viewer'"
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oauth
        key: client-secret
  persistence:
    enabled: true
    storageClassName: truenas-iscsi
    size: 5Gi
  sidecar:
    dashboards:
      # Picks up ConfigMaps labeled grafana_dashboard: "1" from all namespaces
      # (e.g. argo-immich-tieredstorage/monitoring).
      enabled: true
      searchNamespace: ALL
  service:
    type: ClusterIP
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false

# k3s: kube-proxy metrics are not exposed (k3s runs kube-proxy embedded);
# disable its scrape jobs to avoid permanently-down targets.
kubeProxy:
  enabled: false
# k3s: controller-manager and scheduler run as static pods without metrics
# endpoints; drop those scrape jobs too.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
# k3s: the default kubeApiServer ServiceMonitor scrapes the embedded
# apiserver on all 3 control-plane nodes; its histogram families alone
# (apiserver_request_*, etcd_request_*, watch/body-size buckets) generate
# ~150k of the cluster's 274k head series — the main driver of Prometheus
# OOM-kills on this cluster. Homelab: k8s control-plane SLO metrics are not
# consumed by any dashboard/alert we care about.
kubeApiServer:
  enabled: false
# k3s: no separate etcd endpoints exist; the chart's kube-etcd monitor
# never finds targets and its rules can't fire.
kubeEtcd:
  enabled: false
