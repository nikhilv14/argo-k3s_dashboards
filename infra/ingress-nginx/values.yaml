# ingress-nginx 4.14.1. The controller runs as a DaemonSet: the DMZ path
# (Caddy -> 10.250.250.161/162:443) depends on a hostPort listener existing on
# EVERY node, which a Deployment cannot provide. Previously the repo rendered a
# Deployment while an unmanaged DaemonSet (hostPort 80/443, all nodes) carried
# the traffic — ArgoCD watched the harmless object and reported Healthy while
# the real controller was crashlooping on k3s-worker-z690 (2026-11-09).
controller:
  kind: DaemonSet
  # Every node must run a replica; do NOT narrow this to always-on nodes.
  nodeSelector:
    kubernetes.io/os: linux
  hostPort:
    enabled: true
  # Ubuntu 26.04 / newer runc stacks cri-containerd.apparmor.d with
  # "&unconfined" per exec, and AppArmor then denies signal delivery between
  # processes of the SAME container. Symptom on k3s-worker-z690 (2026-11-09):
  # "nginx: [alert] kill(16, 1) failed (13: Permission denied)" on every
  # config reload -> liveness 500 -> crashloop; metallb-speaker HUP denied too.
  # Pod-level Unconfined removes the stacked profile.
  podSecurityContext:
    appArmorProfile:
      type: Unconfined
  ingressClassResource:
    controllerValue: k8s.io/ingress-nginx
    default: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
  service:
    type: LoadBalancer
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
