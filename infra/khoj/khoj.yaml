# Khoj 2.0 beta evaluation deployment.
# Postgres uses emptyDir for now: the iSCSI PVC hung in initdb on this node.
# Chat goes through the local router (cloud alias); MCP tool server is rag-mcp.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: khoj-db
  namespace: khoj
spec:
  serviceName: khoj-db
  replicas: 1
  selector:
    matchLabels:
      app: khoj-db
  template:
    metadata:
      labels:
        app: khoj-db
    spec:
      # initdb hangs on k3s-worker-z690 with this image; stateful exception.
      # Generic workloads (server, controllers) are intentionally unpinned.
      nodeSelector:
        kubernetes.io/hostname: k3s-node1
      containers:
        - name: db
          image: docker.io/pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: khoj-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: khoj-db
  namespace: khoj
spec:
  selector:
    app: khoj-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: khoj
  namespace: khoj
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: khoj
  template:
    metadata:
      labels:
        app: khoj
    spec:
      initContainers:
        - name: wait-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z khoj-db 5432; do sleep 2; done"]
      containers:
        - name: khoj
          image: ghcr.io/khoj-ai/khoj:2.0.0-beta.28
          imagePullPolicy: IfNotPresent
          args: ["--host", "0.0.0.0", "--port", "42110", "--anonymous-mode"]
          ports:
            - containerPort: 42110
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_HOST
              value: khoj-db
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: khoj-secret
                  key: POSTGRES_PASSWORD
            - name: KHOJ_DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: khoj-secret
                  key: KHOJ_DJANGO_SECRET_KEY
            - name: KHOJ_ADMIN_EMAIL
              value: nikhil@daemonagent.net
            - name: KHOJ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: khoj-secret
                  key: KHOJ_ADMIN_PASSWORD
            - name: KHOJ_DEBUG
              value: "False"
            - name: KHOJ_NO_HTTPS
              value: "True"
            - name: KHOJ_DOMAIN
              value: khoj.home
            - name: KHOJ_ALLOWED_DOMAIN
              value: khoj.home
            - name: OPENAI_BASE_URL
              value: http://llm-router.llm.svc.cluster.local:8085/v1
            - name: KHOJ_DEFAULT_CHAT_MODEL
              value: cloud
            - name: KHOJ_SEARXNG_URL
              value: http://searxng.search.svc.cluster.local:8080
            - name: RAG_HUB_URL
              value: http://rag-hub.llm.svc.cluster.local:8765
          volumeMounts:
            - name: config
              mountPath: /root/.khoj
          readinessProbe:
            httpGet:
              path: /
              port: 42110
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 3Gi
      volumes:
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: khoj
  namespace: khoj
spec:
  selector:
    app: khoj
  ports:
    - name: http
      port: 42110
      targetPort: 42110
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: khoj
  namespace: khoj
  annotations:
    cert-manager.io/cluster-issuer: internal-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: khoj.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: khoj
                port:
                  number: 42110
  tls:
    - hosts: [khoj.home]
      secretName: khoj-tls
