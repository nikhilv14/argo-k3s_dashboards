# intel-gpu-plugin DaemonSet (kube-system): advertises gpu.intel.com/i915
# via the device-plugin kubelet socket on every amd64 node. NOT owned by any
# ArgoCD app (applied manually); committed here as source of truth.
#
# Tolerates lxc-no-iscsi=true:NoSchedule on k3s-worker-z690: CRITICAL. If the
# z690 pod is lost and not rescheduled (node reboot, OOM, DS rollout), that
# node stops advertising gpu.intel.com/i915 and every Immich ML replica
# requesting the i915 limit goes Pending.
#
# Re-apply with: kubectl apply -f daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: intel-gpu-plugin
  name: intel-gpu-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: intel-gpu-plugin
  template:
    metadata:
      labels:
        app: intel-gpu-plugin
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: HOST_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
        image: intel/intel-gpu-plugin:0.37.1
        imagePullPolicy: IfNotPresent
        name: intel-gpu-plugin
        resources:
          limits:
            cpu: 100m
            memory: 115Mi
          requests:
            cpu: 40m
            memory: 45Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          seLinuxOptions:
            type: container_device_plugin_t
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /dev/dri
          name: devfs
          readOnly: true
        - mountPath: /sys/class/drm
          name: sysfsdrm
          readOnly: true
        - mountPath: /var/lib/kubelet/device-plugins
          name: kubeletsockets
        - mountPath: /var/run/cdi
          name: cdipath
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/arch: amd64
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /dev/dri
          type: ''
        name: devfs
      - hostPath:
          path: /sys/class/drm
          type: ''
        name: sysfsdrm
      - hostPath:
          path: /var/lib/kubelet/device-plugins
          type: ''
        name: kubeletsockets
      - hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
        name: cdipath
      tolerations:
      - key: lxc-no-iscsi
        operator: Equal
        value: 'true'
        effect: NoSchedule
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
