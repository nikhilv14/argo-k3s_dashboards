# democratic-csi: TrueNAS iSCSI driver (freenas-api-iscsi)
# Managed by ArgoCD app "democratic-csi" (multi-source: chart 0.15.1 + this file
# + manifests/ directory). Secrets are sealed via manifests/sealed-secret.yaml.
csiDriver:
  name: org.democratic-csi
  fsGroupPolicy: File

controller:
  # HA across the 3 control-plane/server nodes (node1, nuc, hp-g9).
  replicaCount: 3

driver:
  # Full driver config (incl. TrueNAS API key) lives in the sealed secret
  # `democratic-csi` (manifests/sealed-secret.yaml), key driver-config-file.yaml.
  # `config.driver` is still required inline so the chart's mount-iscsi helper
  # can detect the iscsi driver and mount iscsiadm into the pods.
  config:
    driver: freenas-api-iscsi
  existingConfigSecret: democratic-csi

node:
  # K3s kubelet uses the standard path on this cluster (verified via
  # kubelet CSI plugin registration logs on k3s-worker-z690).
  kubeletHostPath: /var/lib/kubelet

storageClasses:
  - name: truenas-iscsi
    default: true
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    parameters:
      fsType: ext4
      detachedVolumesFromSnapshots: "false"
