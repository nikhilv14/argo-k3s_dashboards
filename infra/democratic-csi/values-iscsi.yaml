# democratic-csi: TrueNAS iSCSI driver (freenas-api-iscsi)
# Deployed by ArgoCD app "democratic-csi" (argocd/apps-infra.yaml).
# Driver config (incl. TrueNAS API key) lives in sealed-secret.yaml.
csiDriver:
  name: org.democratic-csi
  fsGroupPolicy: File

driver:
  existingConfigSecret: democratic-csi
  config:
    driver: freenas-api-iscsi

node:
  # k3s kubelet on this cluster uses the standard path (confirmed via
  # kubelet CSI plugin registration logs on k3s-worker-z690).
  kubeletHostPath: /var/lib/kubelet

storageClasses:
  - name: truenas-iscsi
    default: true
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    parameters:
      fsType: ext4
      detachedVolumesFromSnapshots: "false"

volumeSnapshotClasses: []
