# democratic-csi secret: TrueNAS API key for the freenas-api-iscsi driver.
# Fill in the placeholder with the contents of ~/.truenas_key, then:
#   kubeseal --controller-name sealed-secrets --controller-namespace kube-system \
#     -o yaml < democratic-csi-secret.yaml > sealed-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: democratic-csi
  namespace: democratic-csi
type: Opaque
stringData:
  driver-config-file.yaml: |
    driver: freenas-api-iscsi
    instance_id: k8s
    httpConnection:
      protocol: https
      host: 192.168.12.50
      port: 443
      apiKey: __REPLACE_WITH_TRUENAS_API_KEY__
      allowInsecure: true
      apiVersion: 2
    zfs:
      datasetParentName: Generic_1TB/k3s_pool/k8s-iscsi/vols
      detachedSnapshotsDatasetParentName: Generic_1TB/k3s_pool/k8s-iscsi/snaps
      zvolBlocksize: 16k
      datasetEnableQuotas: true
      datasetEnableReservation: false
      datasetPermissionsMode: "0770"
      datasetPermissionsUser: 0
      datasetPermissionsGroup: 999
    iscsi:
      targetPortal: "192.168.12.50:3260"
      targetPortals: ["192.168.12.50:3260"]
      interface: ""
      namePrefix: k8s-iscsi-vol-
      nameSuffix: ""
      targetGroups:
        - targetGroupPortalGroup: 1
          targetGroupInitiatorGroup: 1
          targetGroupAuthMethod: none
          targetGroupAuthGroup: null
      extentInsecureTpc: true
      extentXsumData: true
      extentXsumDataDigest: crc32c
      extentQueueDepth: 1024
      extentSparse: true
