# Phase 5 validation: TrueNAS iSCSI pipeline test.
# PVC provisioned by democratic-csi (truenas-iscsi SC), pod pinned to
# k3s-worker-z690 (primary validation node — z690 LXC cannot host iSCSI sessions) to prove kernel iSCSI sessions work there
# — the scenario Longhorn's embedded iscsid failed on.
#
# Apply:  kubectl apply -f manifests/iscsi-validation.yaml
# Watch:  kubectl -n democratic-csi get pvc,pod -l app=iscsi-validation -w
#
# Run fio:  kubectl -n democratic-csi exec iscsi-validation -- \
#     fio --name=randwrite --filename=/mnt/data/fio.test --rw=randwrite \
#     --bs=4k --size=256M --numjobs=4 --iodepth=32 --runtime=30 \
#     --time_based --group_reporting --direct=1
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iscsi-validation
  namespace: democratic-csi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: iscsi-validation
  namespace: democratic-csi
  labels:
    app: iscsi-validation
spec:
  # Remove the nodeSelector to schedule on any node.
  nodeSelector:
    kubernetes.io/hostname: k3s-node1
  containers:
    - name: fio
      # leplusorg/fio does not exist on docker.io; install fio from apk instead.
      image: docker.io/library/alpine:3.20
      command: ["/bin/sh", "-c"]
      args:
        - |
          apk add --no-cache fio >/dev/null 2>&1 || apk add fio
          echo "=== initial block write ==="
          dd if=/dev/zero of=/mnt/data/block0 bs=1M count=16 conv=fsync status=none
          echo "=== quick fio randrw 4k ==="
          fio --name=randrw --filename=/mnt/data/fio.test --rw=randrw --bs=4k \
              --size=256M --numjobs=2 --iodepth=16 --runtime=20 --time_based \
              --group_reporting --direct=1 | tail -20
          echo "=== holding volume for inspection ==="
          sleep infinity
      volumeMounts:
        - name: data
          mountPath: /mnt/data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: iscsi-validation
