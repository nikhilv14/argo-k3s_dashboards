# Phase 5 validation: TrueNAS iSCSI pipeline test.
# PVC provisioned by democratic-csi (truenas-iscsi SC), pod pinned to
# k3s-worker-z690 (privileged LXC) to prove kernel iSCSI sessions work there
# — the scenario Longhorn's embedded iscsid failed on.
# fio: exec into the pod, e.g.
#   kubectl -n democratic-csi exec iscsi-validation -- \
#     fio --name=randwrite --filename=/mnt/data/fio.test --rw=randwrite \
#     --bs=4k --size=256M --numjobs=4 --iodepth=32 --runtime=30 \
#     --time_based --group_reporting --direct=1
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iscsi-validation
  namespace: democratic-csi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: iscsi-validation
  namespace: democratic-csi
  labels:
    app: iscsi-validation
spec:
  # Remove the nodeSelector to schedule on any node.
  nodeSelector:
    kubernetes.io/hostname: k3s-worker-z690
  containers:
    - name: fio
      image: leplusorg/fio:latest
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: data
          mountPath: /mnt/data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: iscsi-validation
