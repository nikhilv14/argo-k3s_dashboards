# Longhorn recurring backup jobs.
# The nightly-backup CronJob itself is auto-generated by longhorn-manager
# from these RecurringJob CRs - only the CRs are managed in Git.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: nightly-backup
  namespace: longhorn-system
  labels:
    longhorn.io/backup-profile: nightly
spec:
  concurrency: 5
  cron: 45 23 * * *
  groups:
    - default
  labels:
    longhorn.io/backup-profile: nightly
  parameters:
    full-backup-interval: "7"
  retain: 7
  task: backup
