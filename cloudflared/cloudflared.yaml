apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: base-apps
  labels:
    app: cloudflared
spec:
  replicas: 2 # Run 2 replicas for high availability
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # WSL2 mirrored networking breaks NAT'd pod egress (microsoft/WSL#11819);
      # host-networked pods are unaffected.
      hostNetwork: true
      # dnsPolicy Default: resolves via host resolv.conf (LAN DNS). Connected-UDP
      # DNS to ClusterIPs fails for hostNetwork pods in WSL2 (connect-time route
      # pins eth2; coredns replies arrive via flannel.1 and are dropped).
      dnsPolicy: Default
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.9.3
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config.yml
        - --no-autoupdate
        - run
        # Locally-managed tunnel: ingress (with httpHostHeader) lives in
        # tunnel-configmap.yaml; credentials in cloudflared-credentials.
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config.yml
          subPath: config.yml
          readOnly: true
        - name: credentials
          mountPath: /etc/cloudflared/credentials.json
          subPath: credentials.json
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: cloudflared-config
      - name: credentials
        secret:
          secretName: cloudflared-credentials
