# Infra adopted from Helm releases.
# ServerSideApply=true lets ArgoCD adopt the existing Helm-managed resources
# in place (no recreate). Once adopted, these releases are ArgoCD-managed;
# do NOT `helm upgrade` them anymore.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.2
      helm:
        valueFiles:
          - $values/infra/cert-manager/values.yaml
    - repoURL: https://github.com/nikhilv14/argo-k3s_dashboards.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra
  source:
# sealed-secrets chart 2.18.0 has been pruned from the Bitnami chart repo and
# OCI registry; pin to the latest available Bitnami OCI chart (2.20.0).
# sealed-secrets chart 2.18.0 was pruned from the Bitnami chart repo and its
# OCI registry (Docker Hub anonymous OCI access also fails from this cluster).
# The 2.20.0 chart is vendored in-repo at infra/sealed-secrets/sealed-secrets/.
    repoURL: https://github.com/nikhilv14/argo-k3s_dashboards.git
    targetRevision: main
    path: infra/sealed-secrets/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.14.5
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  # The metallb controller rewrites the CRD conversion webhook caBundle and
  # service reference at startup; ignore so it doesn't diff forever.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: bgppeers.metallb.io
      jsonPointers:
        - /spec/conversion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
---
# csi-driver-nfs 4.12.x is no longer published to the chart repo; source the
# exact deployed chart from the v4.12.1 git tag instead (charts/v4.12.1/...).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-driver-nfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra
  source:
    repoURL: https://github.com/kubernetes-csi/csi-driver-nfs.git
    targetRevision: v4.12.1
    path: charts/v4.12.1/csi-driver-nfs
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
