apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: immich
  source:
    repoURL: https://github.com/nikhilv14/argo-immich-tieredstorage.git
    targetRevision: main
    path: storage
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: immich
  source:
    repoURL: https://github.com/nikhilv14/argo-immich-tieredstorage.git
    targetRevision: main
    path: database
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: immich
  # HPA owns ML replica count; without this Argo selfHeal fights the autoscaler
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: immich-machine-learning
      jsonPointers:
        - /spec/replicas
  source:
    repoURL: https://github.com/nikhilv14/argo-immich-tieredstorage.git
    targetRevision: main
    path: immich
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: immich
  source:
    repoURL: https://github.com/nikhilv14/argo-immich-tieredstorage.git
    targetRevision: main
    path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
