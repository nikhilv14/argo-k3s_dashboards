apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: khoj
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: infra
  source:
    repoURL: https://github.com/nikhilv14/argo-k3s_dashboards.git
    targetRevision: main
    path: infra/khoj
  destination:
    server: https://kubernetes.default.svc
    namespace: khoj
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
