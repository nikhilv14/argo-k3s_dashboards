apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tandoor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: quick-apps
  source:
    repoURL: https://github.com/nikhilv14/argo-quick-apps.git
    targetRevision: main
    path: tandoor
  destination:
    server: https://kubernetes.default.svc
    namespace: tandoor
  syncPolicy:
    # TEMPORARY: paused for Longhorn -> truenas-iscsi data migration window.
    # Re-enable automated sync after migration verification completes.
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
