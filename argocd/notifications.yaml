apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.email.email: 'host: smtp.gmail.com

    port: 465

    from: nikhil14aug@gmail.com

    username: $email-username

    password: $email-password

    '
  template.email: "email:\n  subject: 'ArgoCD {{.app.metadata.name}} sync={{.app.status.sync.status}}\
    \ health={{.app.status.health.status}}'\n  body: |\n    Application: {{.app.metadata.name}}\n\
    \    Project: {{.app.spec.project}}\n    Sync status: {{.app.status.sync.status}}\n\
    \    Health: {{.app.status.health.status}}\n    Revision: {{.app.status.sync.revision}}\n\
    \    Details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}\n"
  trigger.on-health-degraded: "- when: app.status.health.status == 'Degraded'\n  send:\
    \ [email]\n"
  subscriptions: "- recipients:\n  - email:nikhil14aug@gmail.com\n  triggers:\n  -\
    \ on-sync-failed\n  - on-health-degraded\n  - on-sync-status-unknown\n"
  trigger.on-sync-failed: "- when: app.status.sync.status == 'Error'\n  send: [email]\n"
  trigger.on-sync-status-unknown: "- when: app.status.sync.status == 'Unknown'\n \
    \ send: [email]\n"
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  encryptedData:
    email-password: 
    email-username: 
  template:
    metadata:
      name: argocd-notifications-secret
      namespace: argocd
