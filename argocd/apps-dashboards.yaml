apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: dashboards
  source:
    repoURL: https://github.com/nikhilv14/argo-k3s_dashboards.git
    targetRevision: main
    path: cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: base-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
